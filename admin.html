<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin — Pacha</title><link rel="stylesheet" href="/css/main.css"><script type="module" src="/js/pages/admin.js"></script></head>
<body class="admin-body"><header class="site-header"><a class="brand" href="/">Pacha</a><span class="muted">Administration</span></header><main class="admin-shell"><section id="login-panel" class="admin-card"><p class="eyebrow">Restricted area</p><h1>Admin sign in</h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-primary">Sign in</button><p class="form-error" id="login-error" role="alert"></p></form></section><section id="dashboard" hidden><div class="section-heading"><div><p class="eyebrow">Site management</p><h1>Dashboard</h1></div><button id="logout" class="button button-secondary">Sign out</button></div><div id="stats" class="stats-grid"></div><section class="admin-card"><h2>Add a title</h2><form id="movie-form" class="admin-form"><label>Title<input name="title" required maxlength="200"></label><label>Year<input name="year" type="number" min="1900" max="2100"></label><label>Type<select name="type"><option value="movie">Movie</option><option value="series">Series</option></select></label><label class="wide">Description<textarea name="description" rows="3"></textarea></label><label><input name="is_published" type="checkbox" checked> Published</label><label><input name="is_downloadable" type="checkbox" checked> Allow downloads</label><button class="button button-primary">Create title</button><p class="form-error" id="movie-error" role="alert"></p></form></section><section class="admin-card"><h2>Catalogue</h2><div id="admin-movies" class="admin-movies"></div></section></section></main></body></html>
